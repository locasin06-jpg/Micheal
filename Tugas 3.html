<!DOCTYPE html>
<!-- Feedback: Latihan bagian 1 fluid layout harusnya menggunakan percentage, Latihan bagian 3 fluid layout masih belum benar, Latihan bagian 4 flexbox kurang wrap, Latihan bagian 5 flexbox kurang order pada elemen dengan class contact -->
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Materi 4</title>

        <style>
            body {
                width: 100%;
            }

            /* fluid layout - latihan bagian 1 dan 2 */
            .girl-photo {
                width: 50vh;
            }

            .cat-photo {
                width: 20vh;
            }

            /* flexbox - latihan bagian 4 */
            .container-satu {
                display: flex;
                gap: 10px;
                flex-direction: row;
                justify-content: center;
                border: 3px dotted #b1aaaa;
                gap: 3px;
        
            
            }
          

            .item, 
            .nav {
                border:  2px solid black;
                width: 50px;
                height: 20px;
                padding: 10px;
                text-align: center;
                flex-grow: 1;
                order: 2;
            

            }

            .item {
                background-color: #add6ff;
            }

            /* flexbox - latihan bagian 5 */
            .container-dua {
                border: 3px dotted #b1aaaa;
                display: flex;
                flex-direction: row;
                justify-content: center;
                gap: 6px;
            }

            .nav {
                background-color: #fedbc2;
            }

            .contact {
                background-color: #ffe596;
            }
           
        </style>
    </head>
    <body>
        <!-- fluid layout - latihan bagian 1 dan 2 -->
        <div>
            <img class="girl-photo" src="girl-photo.png" alt="Profil Wanita" />
            <img class="cat-photo" src="cat-photo.jpg" alt="Kucing Oren" />
        </div>

        <!-- fluid layout - latihan bagian 3 -->
        <p>Ini adalah teks pertama</p>
        <div style="font-size: 20px">
            <p style="font-size: 4em">Ini adalah teks kedua</p>
            <p style="font-size: 2rem">Ini adalah teks ketiga</p>
        </div>
        <div style="font-size: 15px">
            <p style="font-size: 4em">Ini adalah teks keempat</p>
            <p style="font-size: 1.5em">Ini adalah teks kelima</p>
        </div>

        <!-- flexbox - latihan bagian 4 -->
        <div class="container-satu">
            <div class="item">Home</div>
            <div class="item">Is</div>
            <div class="item">About</div>
            <div class="item">One</div>
            <div class="item">Direction</div>
        </div>

        <!-- flexbox - latihan bagian 5 -->
        <div class="container-dua">
            <div class="nav home">Home</div>
            <div class="nav contact">Contact</div>
            <div class="nav about">About</div>
            <div class="nav product">Products</div>
        </div>
    </body>

</html>
